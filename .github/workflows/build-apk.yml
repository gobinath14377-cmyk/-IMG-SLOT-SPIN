
name: Build IMG SLOT SPIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Project ZIP
        run: |
          PROJECT_ZIP="IMG_SLOT_SPIN_DAILY_ALARM_RELIABLE_V3.zip"

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERROR: Required project ZIP not found: $PROJECT_ZIP"
            echo "ZIP files available in repository:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "Project ZIP found: $PROJECT_ZIP"

      - name: Extract Project
        run: |
          mkdir -p source
          unzip -q IMG_SLOT_SPIN_DAILY_ALARM_RELIABLE_V3.zip -d source

      - name: Find Android Project
        run: |
          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
          echo "Android project found: $SETTINGS_FILE"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMG-SLOT-SPIN-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

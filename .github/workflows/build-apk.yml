name: Build IMG SLOT SPIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and Extract Project ZIP
        run: |
          PROJECT_ZIP=$(find . -maxdepth 1 -type f -iname 'IMG_SLOT_SPIN_ALARM_SAVE*.zip' -print -quit)

          if [ -z "$PROJECT_ZIP" ]; then
            echo "New Alarm Save ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d source

      - name: Find Android Project
        run: |
          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMG-SLOT-SPIN-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

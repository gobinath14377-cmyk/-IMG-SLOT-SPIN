
name: Build IMG SLOT SPIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check ZIP File
        run: |
          PROJECT_ZIP="IMG_SLOT_SPIN_DAILY_ALARM_POSITIVE_MOTTO_FINAL_FIXED.zip"

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERROR: ZIP file not found: $PROJECT_ZIP"
            exit 1
          fi

          echo "ZIP file found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -q IMG_SLOT_SPIN_DAILY_ALARM_POSITIVE_MOTTO_FINAL_FIXED.zip -d source

      - name: Find Android Project
        run: |
          SETTINGS_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMG-SLOT-SPIN-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
